name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (32-bit)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/ESRunwayPlugin | Out-Null
          Copy-Item build/Release/ESRunwayPlugin.dll package/ESRunwayPlugin/
          Copy-Item config/*.json package/ESRunwayPlugin/
          Compress-Archive -Path package/ESRunwayPlugin -DestinationPath ESRunwayPlugin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ESRunwayPlugin
          path: package/ESRunwayPlugin

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ESRunwayPlugin.zip
            build/Release/ESRunwayPlugin.dll
          prerelease: ${{ contains(github.ref_name, '-') }}
